<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeaferX Viewport Boost Demo</title>
    <script src="https://unpkg.com/leafer-editor@2.1.2/dist/web.min.js"></script>
    <script src="../dist/viewport-boost.umd.js?v=0.10.0"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #121417;
        color: #eef2f7;
        font: 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #stage {
        position: fixed;
        inset: 0;
      }

      .panel {
        position: fixed;
        left: 16px;
        top: 16px;
        z-index: 20;
        width: min(380px, calc(100vw - 32px));
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        background: rgba(18, 20, 23, 0.78);
        backdrop-filter: blur(10px);
        pointer-events: none;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px 12px;
      }

      .stat {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        min-width: 0;
      }

      .stat span:first-child {
        color: #a9b4c0;
      }

      .stat strong {
        overflow: hidden;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <section class="panel">
      <div class="stats">
        <div class="stat"><span>模式</span><strong>官方编辑器</strong></div>
        <div class="stat"><span>插件</span><strong>直接安装</strong></div>
        <div class="stat"><span>元素</span><strong id="count">0</strong></div>
        <div class="stat"><span>创建</span><strong id="createMs">...</strong></div>
        <div class="stat"><span>FPS</span><strong id="fps">...</strong></div>
        <div class="stat"><span>缩放</span><strong id="scale">1.00</strong></div>
      </div>
    </section>

    <script>
      var LeaferLib = window.LeaferUI || window.LeaferEditor || window.Leafer
      var AppClass = LeaferLib.App
      var GroupClass = LeaferLib.Group
      var RectClass = LeaferLib.Rect
      var ViewportBoostClass = LeaferX.viewportBoost.ViewportBoost

      const stage = document.getElementById('stage')
      const app = new AppClass({
        view: stage,
        type: 'viewport',
        editor: {}
      })

      const boost = new ViewportBoostClass(app)
      const tree = app.tree || app
      const countEl = document.getElementById('count')
      const createEl = document.getElementById('createMs')
      const fpsEl = document.getElementById('fps')
      const scaleEl = document.getElementById('scale')

      function createMillion(view) {
        const start = performance.now()
        const groupSize = 10 * 100 * 1.5
        const column = 10
        let total = 0

        for (let i = 0; i < 100; i++) {
          const group = new GroupClass()
          group.x = groupSize * (i % column)
          group.y = groupSize * Math.floor(i / column)
          view.add(group)
          total += create10000(group, 0, 0, `hsl(${i * 3}, 58%, 54%)`)
        }

        countEl.textContent = total.toLocaleString()
        createEl.textContent = Math.round(performance.now() - start) + 'ms'
      }

      function create10000(group, startX, startY, color) {
        let total = 0
        for (let i = 0; i < 100; i++) {
          if (i % 10 === 0) startX += 10
          let y = startY
          for (let j = 0; j < 100; j++) {
            if (j % 10 === 0) y += 10
            group.add(
              new RectClass({
                x: startX,
                y,
                width: 10,
                height: 10,
                fill: color
              })
            )
            y += 12
            total++
          }
          startX += 12
        }
        return total
      }

      function createEditableSamples(view) {
        const samples = [
          { x: 220, y: 180, fill: '#38bdf8' },
          { x: 420, y: 260, fill: '#fbbf24' },
          { x: 620, y: 340, fill: '#34d399' },
          { x: 820, y: 420, fill: '#f472b6' }
        ]
        samples.forEach((item) => {
          view.add(
            new RectClass({
              x: item.x,
              y: item.y,
              width: 120,
              height: 80,
              fill: item.fill,
              cornerRadius: 8,
              editable: true,
              draggable: true
            })
          )
        })
      }

      function currentScale() {
        const layer = tree.zoomLayer || tree
        if (typeof layer.scaleX === 'number') return layer.scaleX
        if (typeof layer.scale === 'number') return layer.scale
        return (layer.scale && layer.scale.x) || 1
      }

      let frames = 0
      let last = performance.now()
      function tick(now) {
        frames++
        if (now - last > 500) {
          fpsEl.textContent = Math.round((frames * 1000) / (now - last))
          frames = 0
          last = now
          scaleEl.textContent = currentScale().toFixed(2)
        }
        requestAnimationFrame(tick)
      }

      createMillion(tree)
      createEditableSamples(tree)
      requestAnimationFrame(tick)
      window.__leaferBoostDemo = { app, tree, boost }
    </script>
  </body>
</html>
